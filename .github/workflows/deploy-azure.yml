name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: Deploy infrastructure and images after the immutable images are pushed
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-azure-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy immutable images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_FRONTEND_APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME }}
      AZURE_BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_PULL_IDENTITY_NAME: ${{ vars.AZURE_PULL_IDENTITY_NAME }}
      AZURE_MIGRATION_JOB_NAME: ${{ vars.AZURE_MIGRATION_JOB_NAME }}
      AZURE_ARTIFACT_STORAGE_ACCOUNT: ${{ vars.AZURE_ARTIFACT_STORAGE_ACCOUNT }}
      AZURE_ARTIFACT_CONTAINER: ${{ vars.AZURE_ARTIFACT_CONTAINER }}
      HOUSING_RENT_SNAPSHOT_BLOB: ${{ vars.HOUSING_RENT_SNAPSHOT_BLOB }}
      HOUSING_RENT_SNAPSHOT_SHA256: ${{ vars.HOUSING_RENT_SNAPSHOT_SHA256 }}
      GOOGLE_AUTH_CLIENT_ID: ${{ vars.GOOGLE_AUTH_CLIENT_ID }}
      GITHUB_AUTH_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate deployment configuration
        shell: bash
        env:
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: |
          set -euo pipefail

          required_values=(
            "${AZURE_CLIENT_ID}"
            "${AZURE_TENANT_ID}"
            "${AZURE_SUBSCRIPTION_ID}"
            "${AZURE_RESOURCE_GROUP}"
            "${AZURE_ACR_NAME}"
            "${AZURE_FRONTEND_APP_NAME}"
            "${AZURE_BACKEND_APP_NAME}"
            "${AZURE_CONTAINERAPPS_ENVIRONMENT}"
            "${AZURE_PULL_IDENTITY_NAME}"
            "${AZURE_MIGRATION_JOB_NAME}"
            "${AZURE_ARTIFACT_STORAGE_ACCOUNT}"
            "${AZURE_ARTIFACT_CONTAINER}"
            "${HOUSING_RENT_SNAPSHOT_BLOB}"
            "${HOUSING_RENT_SNAPSHOT_SHA256}"
            "${GOOGLE_AUTH_CLIENT_ID}"
            "${GITHUB_AUTH_CLIENT_ID}"
            "${NEXT_PUBLIC_KAKAO_MAP_APP_KEY}"
          )

          for value in "${required_values[@]}"; do
            if [[ -z "${value}" ]]; then
              echo "A required production variable or secret is missing." >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned Container Apps CLI extension
        if: inputs.deploy_to_azure
        shell: bash
        run: >-
          az extension add
          --name containerapp
          --version 1.3.0b4
          --yes
          --only-show-errors

      - name: Resolve the existing registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_ACR_NAME}" \
            --query loginServer \
            --output tsv)"

          if [[ -z "${login_server}" ]]; then
            echo "The configured Azure Container Registry was not found." >&2
            exit 1
          fi

          echo "login-server=${login_server}" >> "${GITHUB_OUTPUT}"

      - name: Sign in to the existing registry
        shell: bash
        run: az acr login --name "${AZURE_ACR_NAME}"

      - name: Download verified private data artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_path="data/processed/housing_rent_snapshot.csv"
          mkdir -p "$(dirname "${artifact_path}")"

          az storage blob download \
            --account-name "${AZURE_ARTIFACT_STORAGE_ACCOUNT}" \
            --container-name "${AZURE_ARTIFACT_CONTAINER}" \
            --name "${HOUSING_RENT_SNAPSHOT_BLOB}" \
            --file "${artifact_path}" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors \
            --output none

          printf '%s  %s\n' \
            "${HOUSING_RENT_SNAPSHOT_SHA256}" \
            "${artifact_path}" \
            | sha256sum --check --strict

      - name: Build immutable backend image
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.registry.outputs.login-server }}/sweethome/backend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile.backend \
            --tag "${BACKEND_IMAGE}" \
            .

      - name: Build immutable frontend image
        shell: bash
        env:
          FRONTEND_IMAGE: ${{ steps.registry.outputs.login-server }}/sweethome/frontend:${{ github.sha }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: |
          set -euo pipefail
          docker build \
            --file frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_KAKAO_MAP_APP_KEY="${NEXT_PUBLIC_KAKAO_MAP_APP_KEY}" \
            --tag "${FRONTEND_IMAGE}" \
            frontend

      - name: Push immutable images
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.registry.outputs.login-server }}/sweethome/backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ steps.registry.outputs.login-server }}/sweethome/frontend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "${BACKEND_IMAGE}"
          docker push "${FRONTEND_IMAGE}"

      - name: Validate protected deployment secrets
        if: inputs.deploy_to_azure
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SWEETHOME_INTERNAL_API_KEY: ${{ secrets.SWEETHOME_INTERNAL_API_KEY }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
          GITHUB_AUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL}" || -z "${SWEETHOME_INTERNAL_API_KEY}" \
            || -z "${GOOGLE_AUTH_CLIENT_SECRET}" || -z "${GITHUB_AUTH_CLIENT_SECRET}" ]]; then
            echo "A protected production secret is missing." >&2
            exit 1
          fi
          if [[ "${DATABASE_URL}" != *"sslmode=require"* ]]; then
            echo "DATABASE_URL must enforce sslmode=require." >&2
            exit 1
          fi

      - name: Deploy Container Apps infrastructure
        if: inputs.deploy_to_azure
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
          SWEETHOME_INTERNAL_API_KEY: ${{ secrets.SWEETHOME_INTERNAL_API_KEY }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
          GITHUB_AUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SWEETHOME_BACKEND_IMAGE: ${{ steps.registry.outputs.login-server }}/sweethome/backend:${{ github.sha }}
          SWEETHOME_FRONTEND_IMAGE: ${{ steps.registry.outputs.login-server }}/sweethome/frontend:${{ github.sha }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "sweethome-${GITHUB_SHA::12}" \
            --template-file infra/main.bicep \
            --parameters infra/production.bicepparam \
            --only-show-errors >/dev/null

      - name: Apply database migrations
        if: inputs.deploy_to_azure
        shell: bash
        run: |
          set -euo pipefail
          execution_name="$(az containerapp job start \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_MIGRATION_JOB_NAME}" \
            --query name \
            --output tsv \
            --only-show-errors)"

          if [[ -z "${execution_name}" ]]; then
            echo "The database migration job did not return an execution name." >&2
            exit 1
          fi

          for _ in {1..60}; do
            status="$(az containerapp job execution show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_MIGRATION_JOB_NAME}" \
              --job-execution-name "${execution_name}" \
              --query properties.status \
              --output tsv \
              --only-show-errors)"
            case "${status}" in
              Succeeded)
                exit 0
                ;;
              Failed|Stopped|Degraded)
                echo "Database migration failed with status ${status}." >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Database migration did not complete within five minutes." >&2
          exit 1

      - name: Sign out from Azure and ACR
        if: always()
        shell: bash
        env:
          REGISTRY_LOGIN_SERVER: ${{ steps.registry.outputs.login-server }}
        run: |
          if [[ -n "${REGISTRY_LOGIN_SERVER}" ]]; then
            docker logout "${REGISTRY_LOGIN_SERVER}" >/dev/null 2>&1 || true
          fi
          az logout || true
